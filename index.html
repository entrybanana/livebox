<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Broadcast</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 20px;
        }

        video {
            width: 90%;
            max-width: 1000px;
            margin-top: 20px;
            border-radius: 12px;
            background: black;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #ff4444;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>라이브 방송 테스트</h1>

    <button id="startBtn">방송 시작</button>

    <video id="video" autoplay playsinline controls></video>

    <script>
        const startBtn = document.getElementById("startBtn");
        const video = document.getElementById("video");

        startBtn.addEventListener("click", async () => {

            try {

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                video.srcObject = stream;

            } catch (err) {

                alert("화면 공유 실패");
                console.error(err);

            }

        });
    </script>

</body>
</html>
